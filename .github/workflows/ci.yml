name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Typecheck + Tests + Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Full check (lint + frontend typecheck + tests + architecture doctor)
        run: npm run check

      - name: Production browser and static serving smoke test
        run: npm run test:production-serving

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  compat:
    name: Linux deployment baseline (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Portable HTTP-stack compatibility audit (no Ultimate/uWS HTTP runtime)
        run: npm run test:http-stack-compat

      - name: Start production server and prove health on the glibc 2.35 baseline
        run: |
          export NODE_ENV=production
          export PORT=5555
          export APP_URL=http://127.0.0.1:5555
          export DB_FILE="$RUNNER_TEMP/compat.sqlite3"
          node build/server.js > "$RUNNER_TEMP/compat.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/compat.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5555/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5555/health
          curl -fsS http://127.0.0.1:5555/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5555/api/auth/me)" = "401"
          kill "$(cat "$RUNNER_TEMP/compat.pid")"
