name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: Release validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Resolve npm cache
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        id: npm-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Save npm cache
        if: steps.npm-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ steps.npm-cache-restore.outputs.cache-primary-key }}

      - name: Canonical release validation
        run: npm run validate:release
