version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: auto
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major versions can break tooling (Vite, Svelte, TS, native modules).
      # Upgrade them manually with intent — CI + review, not automation.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: chore(deps)
